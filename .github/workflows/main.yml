name: M0-A Runner Environment Precheck

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-check:
    name: Check Runner and Docker Environment
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check Ubuntu Runner
        run: |
          set -e
          echo "=== Operating System ==="
          cat /etc/os-release
          echo "=== Kernel ==="
          uname -a

      - name: Check Docker Engine
        run: |
          set -e
          docker --version
          docker info

      - name: Check Docker Compose
        run: |
          set -e
          docker compose version

      - name: Prepare Test Image
        run: |
          set -e
          docker pull alpine:3.20

      - name: Test Internal Network and Fixed IPv4
        shell: bash
        run: |
          set -Eeuo pipefail

          TEST_DIR="$(mktemp -d)"
          PROJECT="m0a-${GITHUB_RUN_ID}"
          NETWORK_NAME="${PROJECT}_probe_net"
          CONTAINER_ID=""

          cleanup() {
            docker compose -p "$PROJECT" -f "$TEST_DIR/compose.yaml" down --remove-orphans --volumes || true
            rm -rf "$TEST_DIR"
          }

          trap cleanup EXIT

          cat > "$TEST_DIR/compose.yaml" <<'YAML'
          services:
            probe:
              image: alpine:3.20
              command: ["sh", "-c", "sleep 300"]
              networks:
                probe_net:
                  ipv4_address: 172.30.10.10

          networks:
            probe_net:
              driver: bridge
              internal: true
              ipam:
                config:
                  - subnet: 172.30.10.0/24
                    gateway: 172.30.10.1
          YAML

          echo "=== Validate Compose Configuration ==="
          docker compose -p "$PROJECT" -f "$TEST_DIR/compose.yaml" config

          echo "=== Start Test Container ==="
          docker compose -p "$PROJECT" -f "$TEST_DIR/compose.yaml" up -d

          CONTAINER_ID="$(docker compose -p "$PROJECT" -f "$TEST_DIR/compose.yaml" ps -q probe)"
          test -n "$CONTAINER_ID"

          RUNNING="$(docker inspect -f '{{.State.Running}}' "$CONTAINER_ID")"
          test "$RUNNING" = "true"

          ACTUAL_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CONTAINER_ID")"
          test "$ACTUAL_IP" = "172.30.10.10"

          INTERNAL="$(docker network inspect -f '{{.Internal}}' "$NETWORK_NAME")"
          test "$INTERNAL" = "true"

          echo "Container started successfully."
          echo "Fixed IPv4: $ACTUAL_IP"
          echo "Internal network: $INTERNAL"

          echo "=== Stop and Remove Test Resources ==="
          docker compose -p "$PROJECT" -f "$TEST_DIR/compose.yaml" stop
          docker compose -p "$PROJECT" -f "$TEST_DIR/compose.yaml" down --remove-orphans --volumes

          if docker network inspect "$NETWORK_NAME" >/dev/null 2>&1; then
            echo "ERROR: Test network was not removed."
            exit 1
          fi

          if docker inspect "$CONTAINER_ID" >/dev/null 2>&1; then
            echo "ERROR: Test container was not removed."
            exit 1
          fi

          echo "Test container and network were removed successfully."

          trap - EXIT
          rm -rf "$TEST_DIR"

      - name: Final Docker Environment Summary
        if: always()
        run: |
          echo "M0-A environment precheck finished."
          docker ps -a || true
          docker network ls || true

GitHub 提交说明：

- 提交标题："fix: correct M0-A workflow indentation and cleanup checks"
- 文件路径：".github/workflows/main.yml"
- 操作：打开原来的 "main.yml"，全选旧内容，完整替换成上面的代码，然后提交。
