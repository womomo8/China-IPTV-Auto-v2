name: M0-A and M0-B Docker Network Precheck

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-docker-network-precheck
  cancel-in-progress: false

jobs:
  network-check:
    name: Check Runner and Docker Network Isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check Ubuntu Runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f /etc/os-release
          . /etc/os-release
          test "$ID" = "ubuntu"
          echo "Ubuntu: ${PRETTY_NAME}"
          echo "Kernel: $(uname -r)"
          echo "Architecture: $(uname -m)"

      - name: Check Docker Engine and Compose
        shell: bash
        run: |
          set -Eeuo pipefail
          docker --version
          docker info >/dev/null
          docker compose version
          echo "Docker Engine and Compose are available."

      - name: Build Probe Images and Test Docker Network Isolation
        shell: bash
        run: |
          set -Eeuo pipefail

          TEST_DIR="$(mktemp -d)"
          PROJECT="m0b-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          VALIDATOR_NET="${PROJECT}_validator_net"
          GATEWAY_NET="${PROJECT}_gateway_egress"
          UNAUTHORIZED_NET="${PROJECT}_unauthorized_net"

          GATEWAY_IMAGE="${PROJECT}-media-gateway:local"
          VALIDATOR_IMAGE="${PROJECT}-validator:local"

          GATEWAY_ID=""
          VALIDATOR_ID=""
          UNAUTHORIZED_ID=""

          cleanup_resources() {
            docker compose -p "$PROJECT" -f "$TEST_DIR/compose.yaml" down --remove-orphans --volumes >/dev/null 2>&1 || true
            docker image rm -f "$GATEWAY_IMAGE" "$VALIDATOR_IMAGE" >/dev/null 2>&1 || true
          }

          cleanup() {
            cleanup_resources
            rm -rf "$TEST_DIR"
          }

          diagnose_failure() {
            local exit_code="$1"
            local failed_command="$2"

            trap - ERR
            set +e

            echo ""
            echo "=========================================="
            echo "M0-B FAILURE DIAGNOSTICS"
            echo "=========================================="
            echo "Exit code: $exit_code"
            echo "Failed command: $failed_command"

            echo ""
            echo "=== Compose container status ==="
            docker compose -p "$PROJECT" -f "$TEST_DIR/compose.yaml" ps -a

            for SERVICE in media-gateway validator unauthorized-probe; do
              echo ""
              echo "=== Service: $SERVICE ==="

              CONTAINER_ID="$(docker compose -p "$PROJECT" -f "$TEST_DIR/compose.yaml" ps -aq "$SERVICE" | head -n 1)"

              if [[ -n "$CONTAINER_ID" ]]; then
                echo "--- Container state ---"
                docker inspect -f 'status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} error={{.State.Error}}' "$CONTAINER_ID"

                echo "--- Container logs ---"
                docker logs --tail 80 "$CONTAINER_ID"
              else
                echo "No container ID found for this service."
              fi
            done

            echo ""
            echo "=== Docker networks ==="
            docker network ls

            echo ""
            echo "=== End diagnostics ==="
            return "$exit_code"
          }

          trap cleanup EXIT
          trap 'rc=$?; diagnose_failure "$rc" "$BASH_COMMAND"' ERR

          cat > "$TEST_DIR/Dockerfile.gateway" <<'DOCKER'
          FROM alpine:3.20
          LABEL org.opencontainers.image.title="M0-B gateway network probe"
          CMD ["sh", "-c", "sleep 300"]
          DOCKER

          cat > "$TEST_DIR/Dockerfile.validator" <<'DOCKER'
          FROM alpine:3.20
          LABEL org.opencontainers.image.title="M0-B validator network probe"
          CMD ["sh", "-c", "sleep 300"]
          DOCKER

          echo "=== Prepare base image ==="
          docker pull alpine:3.20

          echo "=== Build gateway probe image ==="
          docker build --pull=false -t "$GATEWAY_IMAGE" -f "$TEST_DIR/Dockerfile.gateway" "$TEST_DIR"

          echo "=== Build validator probe image ==="
          docker build --pull=false -t "$VALIDATOR_IMAGE" -f "$TEST_DIR/Dockerfile.validator" "$TEST_DIR"

          cat > "$TEST_DIR/compose.yaml" <<YAML
          services:
            media-gateway:
              image: ${GATEWAY_IMAGE}
              command:
                - sh
                - -ec
                - |
                  mkdir -p /www
                  echo gateway-ok > /www/index.html
                  exec busybox httpd -f -p 8080 -h /www
              networks:
                validator_net:
                  ipv4_address: 172.30.10.2
                gateway_egress:
                  ipv4_address: 172.30.11.2

            validator:
              image: ${VALIDATOR_IMAGE}
              command: ["sh", "-c", "sleep 300"]
              networks:
                validator_net:
                  ipv4_address: 172.30.10.3

            unauthorized-probe:
              image: ${GATEWAY_IMAGE}
              command:
                - sh
                - -ec
                - |
                  mkdir -p /www
                  echo unauthorized-ok > /www/index.html
                  exec busybox httpd -f -p 18081 -h /www
              networks:
                unauthorized_net:
                  ipv4_address: 172.30.12.2

          networks:
            validator_net:
              name: ${VALIDATOR_NET}
              driver: bridge
              internal: true
              enable_ipv6: false
              ipam:
                config:
                  - subnet: 172.30.10.0/24
                    gateway: 172.30.10.1

            gateway_egress:
              name: ${GATEWAY_NET}
              driver: bridge
              internal: false
              enable_ipv6: false
              ipam:
                config:
                  - subnet: 172.30.11.0/24
                    gateway: 172.30.11.1

            unauthorized_net:
              name: ${UNAUTHORIZED_NET}
              driver: bridge
              internal: true
              enable_ipv6: false
              ipam:
                config:
                  - subnet: 172.30.12.0/24
                    gateway: 172.30.12.1
          YAML

          echo "=== Validate Compose configuration ==="
          docker compose -p "$PROJECT" -f "$TEST_DIR/compose.yaml" config >/dev/null

          echo "=== Check Runner IPv4 egress ==="
          curl --noproxy '*' -4 -sS --connect-timeout 5 --max-time 8 -o /dev/null http://1.1.1.1/
          echo "Runner IPv4 egress is available."

          echo "=== Start probe containers ==="
          docker compose -p "$PROJECT" -f "$TEST_DIR/compose.yaml" up -d

          GATEWAY_ID="$(docker compose -p "$PROJECT" -f "$TEST_DIR/compose.yaml" ps -aq media-gateway | head -n 1)"
          VALIDATOR_ID="$(docker compose -p "$PROJECT" -f "$TEST_DIR/compose.yaml" ps -aq validator | head -n 1)"
          UNAUTHORIZED_ID="$(docker compose -p "$PROJECT" -f "$TEST_DIR/compose.yaml" ps -aq unauthorized-probe | head -n 1)"

          echo "=== Check container IDs ==="
          test -n "$GATEWAY_ID"
          test -n "$VALIDATOR_ID"
          test -n "$UNAUTHORIZED_ID"

          echo "=== Check container running states ==="

          for CONTAINER_ID in "$GATEWAY_ID" "$VALIDATOR_ID" "$UNAUTHORIZED_ID"; do
            RUNNING="$(docker inspect -f '{{.State.Running}}' "$CONTAINER_ID")"
            test "$RUNNING" = "true"
          done

          echo "All three containers are running."

          echo "=== Verify exact network membership ==="

          get_networks() {
            docker inspect -f '{{range $name, $value := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$1" | sort
          }

          diff -u <(printf '%s\n' "$VALIDATOR_NET") <(get_networks "$VALIDATOR_ID")

          diff -u <(printf '%s\n' "$VALIDATOR_NET" "$GATEWAY_NET" | sort) <(get_networks "$GATEWAY_ID")

          diff -u <(printf '%s\n' "$UNAUTHORIZED_NET") <(get_networks "$UNAUTHORIZED_ID")

          echo "Network membership is correct."

          echo "=== Verify fixed IPv4 addresses ==="

          VALIDATOR_IPV4="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{println .IPAddress}}{{end}}' "$VALIDATOR_ID" | sort)"

          GATEWAY_IPV4="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{println .IPAddress}}{{end}}' "$GATEWAY_ID" | sort)"

          test "$VALIDATOR_IPV4" = "172.30.10.3"

          diff -u <(printf '%s\n' "172.30.10.2" "172.30.11.2" | sort) <(printf '%s\n' "$GATEWAY_IPV4")

          echo "Fixed IPv4 addresses are correct."

          echo "=== Verify IPv6 is disabled ==="

          VALIDATOR_IPV6="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{if .GlobalIPv6Address}}{{println .GlobalIPv6Address}}{{end}}{{end}}' "$VALIDATOR_ID")"

          test -z "$VALIDATOR_IPV6"

          VALIDATOR_IPV6_ENABLED="$(docker network inspect -f '{{.EnableIPv6}}' "$VALIDATOR_NET")"

          GATEWAY_IPV6_ENABLED="$(docker network inspect -f '{{.EnableIPv6}}' "$GATEWAY_NET")"

          test "$VALIDATOR_IPV6_ENABLED" = "false"
          test "$GATEWAY_IPV6_ENABLED" = "false"

          echo "IPv6 is disabled on both networks."

          echo "=== Verify Docker network isolation properties ==="

          VALIDATOR_INTERNAL="$(docker network inspect -f '{{.Internal}}' "$VALIDATOR_NET")"

          GATEWAY_INTERNAL="$(docker network inspect -f '{{.Internal}}' "$GATEWAY_NET")"

          test "$VALIDATOR_INTERNAL" = "true"
          test "$GATEWAY_INTERNAL" = "false"

          VALIDATOR_NET_COUNT="$(docker network inspect -f '{{len .Containers}}' "$VALIDATOR_NET")"

          GATEWAY_NET_COUNT="$(docker network inspect -f '{{len .Containers}}' "$GATEWAY_NET")"

          test "$VALIDATOR_NET_COUNT" = "2"
          test "$GATEWAY_NET_COUNT" = "1"

          echo "validator_net internal: $VALIDATOR_INTERNAL"
          echo "gateway_egress internal: $GATEWAY_INTERNAL"
          echo "gateway_egress attached container count: $GATEWAY_NET_COUNT"

          echo "=== Verify gateway access on TCP 8080 ==="

          GATEWAY_READY="false"

          for ATTEMPT in $(seq 1 15); do
            if docker exec "$VALIDATOR_ID" sh -c 'wget -T 2 -q -O - http://172.30.10.2:8080/' 2>/dev/null | grep -qx 'gateway-ok'; then
              GATEWAY_READY="true"
              break
            fi

            sleep 1
          done

          test "$GATEWAY_READY" = "true"

          echo "Validator can reach media-gateway on TCP 8080."

          echo "=== Verify unauthorized service is running ==="

          docker exec "$UNAUTHORIZED_ID" sh -ec 'wget -T 2 -q -O - http://127.0.0.1:18081/ | grep -qx "unauthorized-ok"'

          echo "Unauthorized probe service is ready."

          echo "=== Verify validator cannot access public IPv4 ==="

          if docker exec "$VALIDATOR_ID" sh -c 'wget -T 3 -q -O /dev/null http://1.1.1.1/'; then
            echo "ERROR: validator unexpectedly reached public IPv4."
            exit 1
          fi

          echo "PASS: validator cannot reach public IPv4."

          echo "=== Verify validator cannot access unauthorized container ==="

          if docker exec "$VALIDATOR_ID" sh -c 'wget -T 3 -q -O /dev/null http://172.30.12.2:18081/'; then
            echo "ERROR: validator unexpectedly reached unauthorized container."
            exit 1
          fi

          echo "PASS: validator cannot reach unauthorized container."

          echo "=== M0-B Docker network checks passed ==="

          trap - ERR
          trap - EXIT

          echo "=== Remove probe resources ==="
          cleanup_resources

          echo "=== Verify cleanup ==="

          for NETWORK_NAME in "$VALIDATOR_NET" "$GATEWAY_NET" "$UNAUTHORIZED_NET"; do
            if docker network inspect "$NETWORK_NAME" >/dev/null 2>&1; then
              echo "ERROR: Network was not removed: $NETWORK_NAME"
              exit 1
            fi
          done

          for CONTAINER_ID in "$GATEWAY_ID" "$VALIDATOR_ID" "$UNAUTHORIZED_ID"; do
            if docker inspect "$CONTAINER_ID" >/dev/null 2>&1; then
              echo "ERROR: Probe container was not removed: $CONTAINER_ID"
              exit 1
            fi
          done

          for IMAGE_NAME in "$GATEWAY_IMAGE" "$VALIDATOR_IMAGE"; do
            if docker image inspect "$IMAGE_NAME" >/dev/null 2>&1; then
              echo "ERROR: Probe image was not removed: $IMAGE_NAME"
              exit 1
            fi
          done

          rm -rf "$TEST_DIR"

          echo "All M0-B probe resources were removed."

      - name: Final Runner Summary
        if: always()
        shell: bash
        run: |
          echo "M0-A/M0-B Docker network precheck finished."
          docker ps -a || true
          docker network ls || true
