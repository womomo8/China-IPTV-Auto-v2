
name: IPTV Auto Pipeline

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      test_only:
        description: "Only run tests; skip the IPTV pipeline"
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: iptv-auto-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-chi-sim

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run automated tests
        run: |
          python -m pytest -q

      - name: Find latest saved database
        id: previous
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_only != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[]
              | select(.name == "iptv-database" and .expired == false)
              | select(.workflow_run.id != null)
              | [.created_at, (.workflow_run.id | tostring)]
              | @tsv' \
            | sort \
            | tail -n 1 \
            | cut -f 2)"

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

          if [ -n "$RUN_ID" ]; then
            echo "Found previous database artifact."
          else
            echo "No previous database artifact. A new database will be initialized."
          fi

      - name: Restore previous database
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_only != true }}
        uses: actions/download-artifact@v4
        with:
          name: iptv-database
          path: data
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Run unified IPTV pipeline
        id: pipeline
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_only != true }}
        run: |
          python -m iptv_auto.pipeline

      - name: Checkpoint SQLite database
        id: checkpoint
        if: always() && steps.pipeline.outcome != 'skipped'
        run: |
          if [ -f data/iptv_auto.sqlite3 ]; then
            python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("data/iptv_auto.sqlite3")
          try:
              result = connection.execute(
                  "PRAGMA wal_checkpoint(TRUNCATE)"
              ).fetchone()
              print("WAL checkpoint:", result)
              if result is None or result[0] != 0:
                  raise SystemExit("SQLite checkpoint was not completed.")
          finally:
              connection.close()
          PY
          else
            echo "Database file does not exist; nothing to checkpoint."
            exit 1
          fi

      - name: Validate SQLite database
        id: database
        if: always() && steps.pipeline.outcome != 'skipped'
        run: |
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          path = Path("data/iptv_auto.sqlite3")
          valid = False

          if path.is_file() and path.stat().st_size > 0:
              try:
                  connection = sqlite3.connect(
                      f"file:{path.resolve()}?mode=ro",
                      uri=True
                  )
                  result = connection.execute(
                      "PRAGMA integrity_check"
                  ).fetchone()
                  connection.close()
                  valid = result is not None and result[0] == "ok"
              except sqlite3.Error as error:
                  print(f"Database integrity check failed: {error}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"valid={'true' if valid else 'false'}\n")

          if valid:
              print("SQLite database integrity check passed.")
          else:
              print("Database is missing, empty, or damaged; it will not be uploaded.")
          PY

      - name: Save SQLite database
        if: always() && steps.pipeline.outcome != 'skipped' && steps.checkpoint.outcome == 'success' && steps.database.outputs.valid == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iptv-database
          path: data/iptv_auto.sqlite3
          if-no-files-found: error
          retention-days: 90
          overwrite: true
