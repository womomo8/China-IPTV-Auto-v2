
name: IPTV Auto Pipeline

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: iptv-auto-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-chi-sim

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find latest saved database
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[]
              | select(.name == "iptv-database" and .expired == false)]
              | sort_by(.created_at)
              | last
              | .workflow_run.id // empty')"

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

          if [ -n "$RUN_ID" ]; then
            echo "Found previous database artifact."
          else
            echo "No previous database artifact. A new database will be initialized."
          fi

      - name: Restore previous database
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: iptv-database
          path: data
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Run unified IPTV pipeline
        id: pipeline
        run: |
          python -m iptv_auto.pipeline

      - name: Checkpoint SQLite database
        if: always()
        run: |
          if [ -f data/iptv_auto.sqlite3 ]; then
            python -c "import sqlite3; c=sqlite3.connect('data/iptv_auto.sqlite3'); print(c.execute('PRAGMA wal_checkpoint(TRUNCATE)').fetchall()); c.close()"
          else
            echo "Database file does not exist; nothing to checkpoint."
          fi

      - name: Save SQLite database
        if: always() && hashFiles('data/iptv_auto.sqlite3') != ''
        uses: actions/upload-artifact@v4
        with:
          name: iptv-database
          path: data/iptv_auto.sqlite3
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
