project:
  name: China-IPTV-Auto-v2
  timezone: Asia/Shanghai

paths:
  database: data/iptv_auto.sqlite3
  output_dir: output
  playlist: output/result.m3u
  backup_dir: output/backups
  logs_dir: logs

sources:
  pool_capacity: 30
  new_sources_per_run: 8
  discovery_enabled: true
  manual: []
  # 人工来源示例（默认不启用任何来源）：
  # manual:
  #   - name: "自定义来源"
  #     url: "https://example.com/playlist.m3u"

discovery:
  max_seconds: 480
  request_timeout_seconds: 8
  max_candidate_lines: 36

precheck:
  require_http_or_https_or_supported_stream_scheme: true
  reject_empty_url: true
  reject_obvious_placeholders: true
  # IPv4/IPv6 具体准入策略将在网络探测模块中单独实现并验证，
  # 不在解析阶段把“云端可达”误判为“福建移动家庭网络可达”。

measurement:
  basic_rounds_required_for_release: 3
  basic_timeout_seconds: 8
  max_concurrency: 12
  deep_candidates_per_channel: 5
  deep_timeout_seconds: 25
  stability_retests: 2

scoring:
  weights:
    success_rate: 30
    stability: 25
    throughput: 15
    freshness: 15
    ad_placeholder_risk: 10
    source_reliability: 5
  grades:
    A: 85
    B: 70
    C: 50

release:
  minimum_success_rate: 0.90
  minimum_score: 70
  require_latest_measurement_success: true
  require_three_basic_rounds: true
  require_ffprobe_pass: true
  max_lines_per_channel: 3
  preserve_previous_on_failure: true
  atomic_replace: true

network_identity:
  cloud_measurements_must_be_labeled: true
  never_claim_cloud_test_is_fujian_mobile_home_test: true

blacklist:
  confirmed_ad_or_invalid_content_only: true
  transient_network_errors_are_not_permanent_blacklist: true
  congestion_or_stutter_only_reduces_score: true
